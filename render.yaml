# Sequel Support HR desk.
# Python web service. The FastAPI app serves the page and the HR engines.

previews:
  generation: automatic

services:
  - type: web
    name: hr-automation
    runtime: python
    repo: https://github.com/IanDev-cmd/Hr.automation-
    branch: main
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.12.7"
    buildFilter:
      paths:
        - app/**
        - backend/hr_automata/**
        - static/**
        - index.html
        - sw.js
        - photos/desk.jpg
        - requirements.txt
        - render.yaml
      ignoredPaths:
        - _serve.js
        - backend/tests/**
        - tests/**
    headers:
      - path: /index.html
        name: Cache-Control
        value: "no-cache"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
